<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKES CHECKER · PREMIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --surface: #0b0b0b;
    --border: rgba(255,255,255,0.12);
    --text: #fff;
    --muted: rgba(255,255,255,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.04), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 980px; }

  header { text-align: center; margin-bottom: 56px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 26px;
  }
  h1 {
    font-size: clamp(42px, 8vw, 84px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }
  h1 span { color: transparent; -webkit-text-stroke: 1px #fff; }
  .sub { margin-top: 18px; color: var(--muted); font-size: 15px; font-weight: 300; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .form-row { display: flex; gap: 14px; }
  input {
    flex: 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    letter-spacing: 1px;
    outline: none;
    transition: border-color .3s, box-shadow .3s;
  }
  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }

  button {
    background: #fff;
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 0 34px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .2s, opacity .2s, box-shadow .2s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,255,255,0.15); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .error { color: #ff6b6b; }

  .status { text-align: center; margin-top: 40px; color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; display: none; }
  .loader {
    width: 36px; height: 36px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { margin-top: 48px; display: none; }
  .results.show { display: block; animation: fade .6s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .player {
    text-align: center;
    margin-bottom: 36px;
  }
  .player .tag { font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .player .name { font-size: 34px; font-weight: 800; letter-spacing: -1px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: linear-gradient(160deg, #111 0%, #050505 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    transition: border-color .3s, transform .3s;
    opacity: 0;
    animation: rise .6s ease forwards;
  }
  .card:hover { border-color: rgba(255,255,255,0.4); transform: translateY(-4px); }
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transition: left .9s ease;
  }
  .card:hover::after { left: 150%; }
  .card .k {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .card .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -1px;
    word-break: break-all;
  }
  .card .icon {
    position: absolute;
    right: 22px; top: 22px;
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 15px;
    color: var(--muted);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; }
  .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; }

  .raw {
    margin-top: 28px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 220px;
    overflow: auto;
  }
  .raw-toggle {
    margin-top: 18px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 18px;
    font-size: 11px;
    letter-spacing: 2px;
  }
  .raw-toggle:hover:not(:disabled) { color: #fff; border-color: #fff; box-shadow: none; }

  footer { margin-top: 70px; font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.25); text-transform: uppercase; text-align: center; }

  @media (max-width: 600px) {
    body { padding: 40px 16px; }
    .panel { padding: 24px; }
    .form-row { flex-direction: column; }
    button { padding: 18px; }
    .card .v { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Premium Edition</div>
    <h1>LIKES<br><span>CHECKER</span></h1>
    <p class="sub">Enter your UID and check your likes instantly</p>
  </header>

  <section class="panel">
    <label for="uid">Player UID</label>
    <div class="form-row">
      <input id="uid" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 8568636511" autocomplete="off" maxlength="20">
      <button id="btn">Get Likes</button>
    </div>
    <div class="hint" id="hint">Numbers only</div>
  </section>

  <div class="status" id="status">
    <div class="loader"></div>
    Fetching data
  </div>

  <section class="results" id="results">
    <div class="player">
      <div class="tag">Player Nickname</div>
      <div class="name" id="nickname">—</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="icon">+</div>
        <div class="k">Likes Given By API</div>
        <div class="v" id="likesGiven">—</div>
      </div>
      <div class="card">
        <div class="icon">↑</div>
        <div class="k">Likes After Command</div>
        <div class="v" id="likesAfter">—</div>
      </div>
      <div class="card">
        <div class="icon">↓</div>
        <div class="k">Likes Before Command</div>
        <div class="v" id="likesBefore">—</div>
      </div>
      <div class="card">
        <div class="icon">#</div>
        <div class="k">UID</div>
        <div class="v" id="uidOut">—</div>
      </div>
    </div>

    <button class="raw-toggle" id="rawBtn">Show Raw JSON</button>
    <pre class="raw" id="raw" style="display:none"></pre>
  </section>

  <footer>Premium Digital Tool</footer>
</div>

<script>
  const API_BASE = "https://s26x-like-shop.vercel.app/like";
  const SERVER = "bd";

  const input = document.getElementById("uid");
  const btn = document.getElementById("btn");
  const hint = document.getElementById("hint");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const rawBtn = document.getElementById("rawBtn");
  const rawEl = document.getElementById("raw");

  const fmt = (n) => (typeof n === "number" ? n.toLocaleString("en-US") : (n ?? "—"));

  // Number-only input
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");
    hint.textContent = "Numbers only";
    hint.classList.remove("error");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") fetchLikes();
  });

  btn.addEventListener("click", fetchLikes);

  rawBtn.addEventListener("click", () => {
    const hidden = rawEl.style.display === "none";
    rawEl.style.display = hidden ? "block" : "none";
    rawBtn.textContent = hidden ? "Hide Raw JSON" : "Show Raw JSON";
  });

  async function fetchLikes() {
    const uid = input.value.trim();

    if (!uid) {
      hint.textContent = "Please enter a UID";
      hint.classList.add("error");
      input.focus();
      return;
    }
    if (!/^\d+$/.test(uid)) {
      hint.textContent = "Only numbers are allowed";
      hint.classList.add("error");
      return;
    }

    const url = `${API_BASE}?uid=${encodeURIComponent(uid)}&server_name=${SERVER}`;

    btn.disabled = true;
    results.classList.remove("show");
    status.style.display = "block";

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);

      const data = await res.json();
      render(data);
      hint.textContent = "Done";
      hint.classList.remove("error");
    } catch (err) {
      hint.textContent = "Failed to fetch: " + err.message;
      hint.classList.add("error");
    } finally {
      status.style.display = "none";
      btn.disabled = false;
    }
  }

  function render(d) {
    document.getElementById("nickname").textContent = d.PlayerNickname ?? "—";
    document.getElementById("likesGiven").textContent = fmt(d.LikesGivenByAPI);
    document.getElementById("likesAfter").textContent = fmt(d.LikesafterCommand);
    document.getElementById("likesBefore").textContent = fmt(d.LikesbeforeCommand);
    document.getElementById("uidOut").textContent = d.UID ?? "—";

    rawEl.textContent = JSON.stringify(d, null, 2);

    // Restart card animations
    document.querySelectorAll(".card").forEach(c => {
      c.style.animation = "none";
      void c.offsetWidth;
      c.style.animation = "";
    });

    results.classList.add("show");
  }
</script>
</body>
</html>
